<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" role="img" aria-labelledby="title desc">
  <title id="title">Virtud y vida buena</title>
  <desc id="desc">Ejemplos del justo medio en el valor y la templanza, y relación entre la práctica virtuosa, la vida plena y la convivencia justa.</desc>
  <rect width="640" height="900" fill="#FAF8F5"/>
  <text x="320" y="58" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="34">Virtud y vida buena</text>
  <rect x="32" y="88" width="576" height="360" rx="24" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="320" y="134" text-anchor="middle" fill="#1E3A5F" font-family="Arial, sans-serif" font-size="26" font-weight="700">EJEMPLOS DEL JUSTO MEDIO</text>
  <rect x="52" y="157" width="168" height="54" rx="15" fill="#8C3B2B"/>
  <text x="136" y="192" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="21" font-weight="700">EXCESO</text>
  <rect x="236" y="157" width="168" height="54" rx="15" fill="#1E3A5F"/>
  <text x="320" y="192" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="21" font-weight="700">VIRTUD</text>
  <rect x="420" y="157" width="168" height="54" rx="15" fill="#D8D1C7"/>
  <text x="504" y="192" text-anchor="middle" fill="#18181B" font-family="Arial, sans-serif" font-size="21" font-weight="700">DEFECTO</text>
  <rect x="52" y="221" width="168" height="60" rx="15" fill="#FAF8F5"/>
  <text x="136" y="259" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="22">Temeridad</text>
  <rect x="236" y="221" width="168" height="60" rx="15" fill="#FAF8F5"/>
  <text x="320" y="259" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="22">Valor</text>
  <rect x="420" y="221" width="168" height="60" rx="15" fill="#FAF8F5"/>
  <text x="504" y="259" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="22">Cobardía</text>
  <rect x="52" y="291" width="168" height="60" rx="15" fill="#FAF8F5"/>
  <text x="136" y="329" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="22">Desenfreno</text>
  <rect x="236" y="291" width="168" height="60" rx="15" fill="#FAF8F5"/>
  <text x="320" y="329" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="22">Templanza</text>
  <rect x="420" y="291" width="168" height="60" rx="15" fill="#FAF8F5"/>
  <text x="504" y="329" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="20">Insensibilidad</text>
  <text x="320" y="388" text-anchor="middle" fill="#625E59" font-family="Georgia, serif" font-size="20">La medida depende de la persona y la situación:</text>
  <text x="320" y="418" text-anchor="middle" fill="#625E59" font-family="Georgia, serif" font-size="20">no es un promedio aritmético.</text>
  <rect x="92" y="490" width="456" height="120" rx="24" fill="#FAF8F5" stroke="#8C3B2B" stroke-width="2"/>
  <text x="320" y="540" text-anchor="middle" fill="#8C3B2B" font-family="Arial, sans-serif" font-size="25" font-weight="700">PRÁCTICA Y HÁBITO</text>
  <text x="320" y="578" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="23">forman un carácter virtuoso</text>
  <path d="M320 610v38l-130 30" fill="none" stroke="#8C3B2B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M320 648l130 30" fill="none" stroke="#8C3B2B" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="32" y="690" width="276" height="130" rx="24" fill="#1E3A5F"/>
  <text x="170" y="742" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="24">EUDAIMONÍA</text>
  <text x="170" y="782" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="22">vida plena</text>
  <rect x="332" y="690" width="276" height="130" rx="24" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="470" y="742" text-anchor="middle" fill="#1E3A5F" font-family="Georgia, serif" font-size="24">BIEN COMÚN</text>
  <text x="470" y="782" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="22">vida compartida</text>
  <text x="320" y="865" text-anchor="middle" fill="#625E59" font-family="Georgia, serif" font-size="21">La excelencia personal se practica con otros.</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#8C3B2B"/></marker></defs>
</svg>
