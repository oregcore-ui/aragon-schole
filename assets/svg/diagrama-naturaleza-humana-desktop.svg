<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">El alma y el viviente en Platón y Aristóteles</title>
  <desc id="desc">Platón distingue tres principios del alma y separa alma y cuerpo; Aristóteles entiende materia y forma como principios de un solo viviente.</desc>
  <rect width="960" height="560" fill="#FAF8F5"/>
  <text x="480" y="58" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="32">Alma y cuerpo en la filosofía clásica</text>
  <rect x="40" y="95" width="420" height="420" rx="24" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="250" y="140" text-anchor="middle" fill="#1E3A5F" font-family="Arial, sans-serif" font-size="24" font-weight="700">PLATÓN · REPÚBLICA IV</text>
  <text x="250" y="174" text-anchor="middle" fill="#625E59" font-family="Georgia, serif" font-size="20">Tres principios de una misma alma</text>
  <rect x="85" y="194" width="330" height="48" rx="16" fill="#1E3A5F"/>
  <text x="250" y="225" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="21">Racional · razón</text>
  <rect x="85" y="252" width="330" height="48" rx="16" fill="#8C3B2B"/>
  <text x="250" y="283" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="21">Irascible · ánimo</text>
  <rect x="85" y="310" width="330" height="48" rx="16" fill="#D8D1C7"/>
  <text x="250" y="341" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="21">Apetitivo · deseos</text>
  <text x="250" y="400" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="19">El alma, distinta del cuerpo,</text>
  <text x="250" y="428" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="19">puede conocer lo inteligible.</text>
  <rect x="500" y="95" width="420" height="420" rx="24" fill="#FFFFFF" stroke="#8C3B2B" stroke-width="2"/>
  <text x="710" y="140" text-anchor="middle" fill="#8C3B2B" font-family="Arial, sans-serif" font-size="24" font-weight="700">ARISTÓTELES</text>
  <text x="710" y="174" text-anchor="middle" fill="#625E59" font-family="Georgia, serif" font-size="19">Acerca del alma · unidad hilemórfica</text>
  <rect x="545" y="198" width="145" height="70" rx="18" fill="#D8D1C7"/>
  <text x="617" y="228" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="20">MATERIA</text>
  <text x="617" y="253" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="18">cuerpo</text>
  <rect x="730" y="198" width="145" height="70" rx="18" fill="#1E3A5F"/>
  <text x="802" y="228" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="20">FORMA</text>
  <text x="802" y="253" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="18">alma</text>
  <path d="M617 268v35l93 27 93-27v-35" fill="none" stroke="#8C3B2B" stroke-width="3"/>
  <rect x="560" y="330" width="300" height="58" rx="18" fill="#FAF8F5" stroke="#8C3B2B" stroke-width="2"/>
  <text x="710" y="367" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="22">Un solo viviente</text>
  <text x="710" y="428" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="19">El alma es forma del cuerpo vivo.</text>
</svg>
