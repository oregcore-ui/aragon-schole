<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 930" role="img" aria-labelledby="title desc">
  <title id="title">Alma, cuerpo y naturaleza humana</title>
  <desc id="desc">Platón distingue tres principios del alma y diferencia alma y cuerpo; Aristóteles explica al viviente como unidad de materia y forma.</desc>
  <rect width="640" height="930" fill="#FAF8F5"/>
  <text x="320" y="58" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="34">Alma, cuerpo y naturaleza humana</text>
  <rect x="32" y="88" width="576" height="405" rx="24" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="320" y="140" text-anchor="middle" fill="#1E3A5F" font-family="Arial, sans-serif" font-size="27" font-weight="700">PLATÓN · REPÚBLICA IV</text>
  <text x="320" y="181" text-anchor="middle" fill="#625E59" font-family="Georgia, serif" font-size="23">Tres principios de una misma alma</text>
  <rect x="70" y="204" width="500" height="58" rx="18" fill="#1E3A5F"/>
  <text x="320" y="241" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="24">Racional · conocimiento y deliberación</text>
  <rect x="70" y="274" width="500" height="58" rx="18" fill="#8C3B2B"/>
  <text x="320" y="311" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="24">Irascible · ánimo y valor</text>
  <rect x="70" y="344" width="500" height="58" rx="18" fill="#D8D1C7"/>
  <text x="320" y="381" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="24">Apetitivo · deseos y necesidades</text>
  <text x="320" y="451" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="21">El alma puede conocer lo inteligible; el cuerpo es sensible.</text>
  <rect x="32" y="515" width="576" height="390" rx="24" fill="#FFFFFF" stroke="#8C3B2B" stroke-width="2"/>
  <text x="320" y="565" text-anchor="middle" fill="#8C3B2B" font-family="Arial, sans-serif" font-size="27" font-weight="700">ARISTÓTELES · ACERCA DEL ALMA</text>
  <text x="320" y="603" text-anchor="middle" fill="#625E59" font-family="Georgia, serif" font-size="22">El viviente reúne dos principios</text>
  <rect x="72" y="625" width="220" height="74" rx="18" fill="#D8D1C7"/>
  <text x="182" y="655" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="23">MATERIA</text>
  <text x="182" y="682" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="21">cuerpo</text>
  <rect x="348" y="625" width="220" height="74" rx="18" fill="#1E3A5F"/>
  <text x="458" y="655" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="23">FORMA</text>
  <text x="458" y="682" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="21">alma</text>
  <path d="M182 699v32l138 25m138-57v32l-138 25" fill="none" stroke="#8C3B2B" stroke-width="3"/>
  <rect x="98" y="756" width="444" height="66" rx="20" fill="#FAF8F5" stroke="#8C3B2B" stroke-width="2"/>
  <text x="320" y="798" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="25">Unidad sustancial · un solo viviente</text>
  <text x="320" y="865" text-anchor="middle" fill="#625E59" font-family="Georgia, serif" font-size="21">El alma es acto primero de un cuerpo organizado.</text>
</svg>
