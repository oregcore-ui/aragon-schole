<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">El justo medio y la vida buena</title>
  <desc id="desc">El valor y la templanza se muestran entre sus excesos y defectos; la práctica virtuosa contribuye a una vida plena y compartida.</desc>
  <rect width="960" height="640" fill="#FAF8F5"/>
  <text x="480" y="58" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="32">Virtud y vida buena</text>
  <rect x="40" y="90" width="880" height="280" rx="24" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="480" y="132" text-anchor="middle" fill="#1E3A5F" font-family="Arial, sans-serif" font-size="25" font-weight="700">DOS EJEMPLOS DEL JUSTO MEDIO</text>
  <rect x="70" y="150" width="240" height="48" rx="15" fill="#8C3B2B"/>
  <text x="190" y="181" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">EXCESO</text>
  <rect x="360" y="150" width="240" height="48" rx="15" fill="#1E3A5F"/>
  <text x="480" y="181" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">VIRTUD</text>
  <rect x="650" y="150" width="240" height="48" rx="15" fill="#D8D1C7"/>
  <text x="770" y="181" text-anchor="middle" fill="#18181B" font-family="Arial, sans-serif" font-size="20" font-weight="700">DEFECTO</text>
  <rect x="70" y="207" width="240" height="52" rx="15" fill="#FAF8F5"/>
  <text x="190" y="241" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="20">Temeridad</text>
  <rect x="360" y="207" width="240" height="52" rx="15" fill="#FAF8F5"/>
  <text x="480" y="241" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="20">Valor</text>
  <rect x="650" y="207" width="240" height="52" rx="15" fill="#FAF8F5"/>
  <text x="770" y="241" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="20">Cobardía</text>
  <rect x="70" y="267" width="240" height="52" rx="15" fill="#FAF8F5"/>
  <text x="190" y="301" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="20">Desenfreno</text>
  <rect x="360" y="267" width="240" height="52" rx="15" fill="#FAF8F5"/>
  <text x="480" y="301" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="20">Templanza</text>
  <rect x="650" y="267" width="240" height="52" rx="15" fill="#FAF8F5"/>
  <text x="770" y="301" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="20">Insensibilidad</text>
  <text x="480" y="348" text-anchor="middle" fill="#625E59" font-family="Georgia, serif" font-size="18">La medida depende de la persona y la situación; no es un promedio.</text>
  <rect x="310" y="390" width="340" height="72" rx="22" fill="#FAF8F5" stroke="#8C3B2B" stroke-width="2"/>
  <text x="480" y="421" text-anchor="middle" fill="#8C3B2B" font-family="Arial, sans-serif" font-size="21" font-weight="700">PRÁCTICA Y HÁBITO</text>
  <text x="480" y="447" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="18">forman el carácter virtuoso</text>
  <path d="M425 462l-170 42" fill="none" stroke="#8C3B2B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M535 462l170 42" fill="none" stroke="#8C3B2B" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="75" y="510" width="360" height="92" rx="22" fill="#1E3A5F"/>
  <text x="255" y="550" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="22">EUDAIMONÍA</text>
  <text x="255" y="580" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="19">vida plena</text>
  <rect x="525" y="510" width="360" height="92" rx="22" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="705" y="550" text-anchor="middle" fill="#1E3A5F" font-family="Georgia, serif" font-size="22">BIEN COMÚN</text>
  <text x="705" y="580" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="19">vida compartida</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#8C3B2B"/></marker></defs>
</svg>
