<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1020" role="img" aria-labelledby="title desc">
  <title id="title">Conocimiento y realidad en Platón y Aristóteles</title>
  <desc id="desc">La línea dividida muestra cuatro grados de conocimiento en Platón; materia y forma componen una sustancia, y potencia y acto explican el cambio en Aristóteles.</desc>
  <rect width="640" height="1020" fill="#FAF8F5"/>
  <text x="320" y="58" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="34">Conocimiento y realidad</text>
  <rect x="32" y="88" width="576" height="465" rx="24" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="320" y="140" text-anchor="middle" fill="#1E3A5F" font-family="Arial, sans-serif" font-size="27" font-weight="700">PLATÓN · LÍNEA DIVIDIDA</text>
  <text x="320" y="179" text-anchor="middle" fill="#625E59" font-family="Georgia, serif" font-size="22">Grados de conocimiento y de realidad</text>
  <rect x="80" y="198" width="480" height="58" rx="16" fill="#1E3A5F"/>
  <text x="320" y="235" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="23">Noesis · conocimiento de las Ideas</text>
  <rect x="80" y="266" width="480" height="58" rx="16" fill="#48698F"/>
  <text x="320" y="303" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="23">Dianoia · pensamiento matemático</text>
  <rect x="80" y="334" width="480" height="58" rx="16" fill="#8C3B2B"/>
  <text x="320" y="371" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="23">Pistis · creencia en objetos sensibles</text>
  <rect x="80" y="402" width="480" height="58" rx="16" fill="#D8D1C7"/>
  <text x="320" y="439" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="23">Eikasia · imágenes y conjetura</text>
  <text x="320" y="506" text-anchor="middle" fill="#625E59" font-family="Georgia, serif" font-size="21">De las imágenes sensibles a lo inteligible.</text>
  <rect x="32" y="575" width="576" height="410" rx="24" fill="#FFFFFF" stroke="#8C3B2B" stroke-width="2"/>
  <text x="320" y="625" text-anchor="middle" fill="#8C3B2B" font-family="Arial, sans-serif" font-size="27" font-weight="700">ARISTÓTELES · SUSTANCIA Y CAMBIO</text>
  <rect x="72" y="657" width="220" height="74" rx="18" fill="#D8D1C7"/>
  <text x="182" y="687" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="23">MATERIA</text>
  <text x="182" y="714" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="21">de qué está hecho</text>
  <rect x="348" y="657" width="220" height="74" rx="18" fill="#1E3A5F"/>
  <text x="458" y="687" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="23">FORMA</text>
  <text x="458" y="714" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="21">qué es</text>
  <path d="M182 731v26l138 25m138-51v26l-138 25" fill="none" stroke="#8C3B2B" stroke-width="3"/>
  <rect x="98" y="782" width="444" height="60" rx="18" fill="#FAF8F5" stroke="#8C3B2B" stroke-width="2"/>
  <text x="320" y="820" text-anchor="middle" fill="#18181B" font-family="Georgia, serif" font-size="24">Sustancia individual</text>
  <text x="320" y="878" text-anchor="middle" fill="#625E59" font-family="Georgia, serif" font-size="21">El cambio: capacidad que llega a realizarse</text>
  <rect x="88" y="895" width="190" height="62" rx="18" fill="#8C3B2B"/>
  <text x="183" y="922" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="22">POTENCIA</text>
  <text x="183" y="946" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="19">capacidad</text>
  <path d="M290 926h60" stroke="#18181B" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="362" y="895" width="190" height="62" rx="18" fill="#1E3A5F"/>
  <text x="457" y="922" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="22">ACTO</text>
  <text x="457" y="946" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="19">realización</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#18181B"/></marker></defs>
</svg>
